instructions.block.action=Segurar bloqueia; erguer no impacto apara
instructions.dodge.keys=SHIFT / K
instructions.dodge.action=Esquivar; cancelar o fim de um golpe
instructions.pause.keys=ESC / M
instructions.pause.action=Pausar / ativar ou desativar o som
instructions.respawn.keys=R / ENTER após morrer
instructions.respawn.action=Retornar ao início ou ao santuário
instructions.tips=Bandagens curam; o santuário restaura a vida.\nPressione espada no fim de um golpe para preparar o próximo.\nGolpes vermelhos rompem a guarda. Aparar dá um acerto extra no chefe.

