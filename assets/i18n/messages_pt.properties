overlay.victory.title=ALÉM DAS MURALHAS
overlay.victory.text=A passagem dos peregrinos está livre.\nSeu juramento foi cumprido.
overlay.pause.title=EM VIGÍLIA
overlay.pause.text=ESC - Continuar     |     M - Som\n\nO jogo pausa ao perder o foco da janela.

