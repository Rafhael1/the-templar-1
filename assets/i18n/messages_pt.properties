level.constantinople.chapter=FASE 2 / ÀS PORTAS DE CONSTANTINOPLA / 1096-1097
level.constantinople.title=Às portas de Constantinopla
level.constantinople.story=Os líderes cruzados negociam com Aleixo I a devolução de antigos territórios bizantinos e a travessia rumo à Ásia.
level.constantinople.travel=SIGA ATÉ O BÓSFORO
level.constantinople.city=CONSTANTINOPLA - Os líderes cruzados se reúnem.
level.constantinople.harbor=BÓSFORO - As embarcações aguardam no porto.
level.constantinople.fight=DERROTE O CAPITÃO
level.constantinople.boss=CAPITÃO DO PORTO
level.constantinople.arena=O Capitão do Porto bloqueia a alfândega. Salte ou esquive ao ver a linha de mira.
level.constantinople.embark=EMBARQUE PARA A ÁSIA
level.constantinople.complete=DO OUTRO LADO DO BÓSFORO
level.constantinople.victory=Com o apoio de Aleixo I e as companhias reunidas,\na frota cruza o Bósforo rumo à Ásia.
level.constantinople.market=MERCADO - Entre as arcadas, mercadorias e viajantes a caminho do porto.
level.constantinople.oath.title=ALEIXO I / Os juramentos
level.constantinople.oath.body=Entre 1096 e 1097, os líderes chegaram a Constantinopla em momentos diferentes. Aleixo I pediu que jurassem devolver ao Império as cidades reconquistadas que antes lhe pertenciam. Em troca, os cruzados contavam com apoio bizantino para seguir viagem.
level.constantinople.rivalry.title=ENVIADO DOS CRUZADOS / As divergências
level.constantinople.rivalry.body=Cada companhia tinha seus próprios interesses. Raimundo de Toulouse resistiu ao juramento que outros líderes haviam prestado. Segundo algumas crônicas, ele se comprometeu a respeitar a vida e a honra do imperador.
level.constantinople.crossing.title=INTENDENTE BIZANTINO / Rumo à Ásia Menor
level.constantinople.crossing.body=A travessia levou os cruzados à Ásia Menor em grupos. Em 1097, os contingentes seguiram por rotas diferentes antes de se reunir diante de Niceia para o cerco.
conversation.open=[F] Conversar
conversation.close=[F] Encerrar conversa
conversation.confirm=[F] Confirmar plano
dev.title=Modo dev / Selecionar fase
dev.help=Setas ou W/S para escolher. Enter para abrir. F2 volta ao seletor.
overlay.levelComplete.next=ENTER - Próxima fase
overlay.victory.restart=ENTER - Nova jornada
hud.briefingsConfirmed=PLANOS CONFIRMADOS / SIGA ATÉ O REDUTO
level.nicaea.chapter=FASE 3 / AS MURALHAS DE NICEIA / 1097
level.nicaea.title=As muralhas de Niceia
level.nicaea.story=Em 1097, cruzados e bizantinos cercam Niceia. Diante das forças de socorro, o bloqueio do lago e as negociações decidem a quem a cidade se rende.
level.nicaea.travel=CONFIRME OS PLANOS COM OS DOIS ALIADOS [F]
level.nicaea.lake=LAGO ASCANIANO - Niceia recebe suprimentos pela água.
level.nicaea.earthworks=OBRAS DE CERCO - As companhias avançam por diques e plataformas diante das muralhas.
level.nicaea.relief=COLINAS DE NICEIA - A força de socorro tenta romper o cerco.
level.nicaea.land.title=OFICIAL CRUZADO / O cerco por terra
level.nicaea.land.body=Cada companhia vigia um trecho da muralha. A força de socorro do sultão pode romper o cerco se um setor ceder. Confirme o plano aqui e procure Manuel Butumita na margem do lago.
level.nicaea.blockade.title=MANUEL BUTUMITA / O bloqueio e o acordo
level.nicaea.blockade.body=Os barcos de Aleixo I chegaram por terra ao lago. Confirme o sinal para fecharmos a rota de suprimentos. Enquanto vocês contêm o socorro, vou negociar a rendição da guarnição ao imperador.
level.nicaea.arena=O Duelista do Socorro ataca em dois tempos. O segundo corte rompe a guarda. Esquive ou apare e contra-ataque na recuperação.
level.nicaea.fight=DETENHA O DUELISTA
level.nicaea.boss=DUELISTA DO SOCORRO
level.nicaea.exit=SIGA ATÉ O ESTANDARTE BIZANTINO
level.nicaea.complete=NICEIA SOB CONTROLE BIZANTINO
level.nicaea.victory=Com o socorro repelido e o lago bloqueado, a guarnição aceitou o acordo negociado por Manuel Butumita. Em junho de 1097, Niceia foi entregue a Aleixo I.
