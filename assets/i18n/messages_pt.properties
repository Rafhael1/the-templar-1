intro.call.text=URBANO II\nCavaleiros, tomai a cruz e marchai ao Oriente.\nRespondei ao chamado de guerra. Protegei os peregrinos na estrada.
intro.march.title=A LONGA MARCHA / 1096 - 1099
intro.march.text=Do acampamento às estradas da Anatólia, de Antioquia a Jerusalém.\nEncontre abrigo, preserve suas forças e atravesse as muralhas.
intro.navigation=ENTER / ESPAÇO / CLIQUE continuar     ESC pular

