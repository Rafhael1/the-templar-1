# instructions
instructions.goal=Abra o portão, derrote o guardião e proteja os peregrinos.
instructions.move.keys=A / D ou setas
instructions.move.action=Mover
instructions.jump.keys=ESPAÇO / W / CIMA
instructions.jump.action=Saltar
instructions.attack.keys=J / Z
instructions.attack.action=Atacar com a espada
instructions.downAttack.keys=S / BAIXO + J / Z no ar
instructions.downAttack.action=Golpear para baixo; quicar ao acertar
