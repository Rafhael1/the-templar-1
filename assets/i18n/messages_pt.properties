level.constantinople.chapter=FASE 2 / ÀS PORTAS DE CONSTANTINOPLA / 1096-1097
level.constantinople.title=Às portas de Constantinopla
level.constantinople.story=Os líderes cruzados negociam com Aleixo I a devolução de antigos territórios bizantinos e a travessia rumo à Ásia.
level.constantinople.travel=SIGA ATÉ O BÓSFORO
level.constantinople.city=CONSTANTINOPLA - Os líderes cruzados se reúnem.
level.constantinople.harbor=BÓSFORO - As embarcações aguardam no porto.
level.constantinople.fight=DERROTE O CAPITÃO
level.constantinople.boss=CAPITÃO DO PORTO
level.constantinople.arena=O Capitão do Porto bloqueia a alfândega. Salte ou esquive ao ver a linha de mira.
level.constantinople.embark=EMBARQUE PARA A ÁSIA
level.constantinople.complete=DO OUTRO LADO DO BÓSFORO
level.constantinople.victory=Com o apoio de Aleixo I e as companhias reunidas,\na frota cruza o Bósforo rumo à Ásia.\n\nENTER - Nova jornada
level.constantinople.market=MERCADO - Entre as arcadas, mercadorias e viajantes a caminho do porto.
level.constantinople.oath.title=ALEIXO I / Os juramentos
level.constantinople.oath.body=Entre 1096 e 1097, os líderes chegaram a Constantinopla em momentos diferentes. Aleixo I pediu que jurassem devolver ao Império as cidades reconquistadas que antes lhe pertenciam. Em troca, os cruzados contavam com apoio bizantino para seguir viagem.
level.constantinople.rivalry.title=ENVIADO DOS CRUZADOS / As divergências
level.constantinople.rivalry.body=Cada companhia tinha seus próprios interesses. Raimundo de Toulouse resistiu ao juramento que outros líderes haviam prestado. Segundo algumas crônicas, ele se comprometeu a respeitar a vida e a honra do imperador.
level.constantinople.crossing.title=INTENDENTE BIZANTINO / Rumo à Ásia Menor
level.constantinople.crossing.body=A travessia levou os cruzados à Ásia Menor em grupos. Em 1097, os contingentes seguiram por rotas diferentes antes de se reunir diante de Niceia para o cerco.
