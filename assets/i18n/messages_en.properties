# instructions
instructions.goal=Open the gate, defeat the guardian and protect the pilgrims.
instructions.move.keys=A / D or arrow keys
instructions.move.action=Move
instructions.jump.keys=SPACE / W / UP
instructions.jump.action=Jump
instructions.attack.keys=J / Z
instructions.attack.action=Sword attack
instructions.downAttack.keys=S / DOWN + J / Z in the air
instructions.downAttack.action=Downward attack; bounce on a hit
instructions.block.keys=L / X (hold)
instructions.block.action=Hold to block; raise on impact to parry
instructions.dodge.keys=SHIFT / K
instructions.dodge.action=Dodge; cancel the end of a swing
instructions.pause.keys=ESC / M
instructions.pause.action=Pause / toggle sound
instructions.respawn.keys=R / ENTER after death
instructions.respawn.action=Return to the start or sanctuary
instructions.tips=Bandages heal; the sanctuary restores health.\nPress sword near the end of a swing to queue the next attack.\nRed attacks break your shield. Parry for one bonus boss hit.

