# intro
intro.council.title=CLERMONT / 1095
intro.council.text=Pope Urban II gathers the knights at Clermont.\nAn expedition to the East is about to change their lives.
intro.call.title=THE CALL
intro.call.text=URBAN II\nKnights, take up the cross and march to the East.\nAnswer the call to war. Protect the pilgrims on the road.
intro.march.title=THE LONG MARCH / 1096 - 1099
intro.march.text=From camp to the roads of Anatolia, from Antioch to Jerusalem.\nFind shelter, preserve your strength and cross the walls.
intro.navigation=ENTER / SPACE / CLICK continue     ESC skip

