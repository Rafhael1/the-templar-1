level.constantinople.chapter=STAGE 2 / AT THE GATES OF CONSTANTINOPLE / 1096-1097
level.constantinople.title=At the Gates of Constantinople
level.constantinople.story=The Crusader leaders negotiate with Alexios I over former Byzantine territories and passage to Asia.
level.constantinople.travel=REACH THE BOSPHORUS
level.constantinople.city=CONSTANTINOPLE - The Crusader leaders assemble.
level.constantinople.harbor=BOSPHORUS - The ships await in the harbor.
level.constantinople.fight=DEFEAT THE CAPTAIN
level.constantinople.boss=HARBOR CAPTAIN
level.constantinople.arena=The Harbor Captain blocks the customs house. Jump or dodge when the aim line appears.
level.constantinople.embark=BOARD FOR ASIA
level.constantinople.complete=ACROSS THE BOSPHORUS
level.constantinople.victory=With Alexios I's support and the companies united,\nthe fleet crosses the Bosphorus into Asia.
level.constantinople.market=MARKET - Goods and travelers pass through the arcades on the way to the harbor.
level.constantinople.oath.title=ALEXIOS I / The oaths
level.constantinople.oath.body=Between 1096 and 1097, the leaders reached Constantinople at different times. Alexios I asked them to swear to return recaptured cities that had once belonged to the Empire. In return, the Crusaders counted on Byzantine support to continue their journey.
level.constantinople.rivalry.title=CRUSADER ENVOY / The disagreements
level.constantinople.rivalry.body=Each company had interests of its own. Raymond of Toulouse resisted the oath other leaders had taken. According to some chronicles, he pledged to respect the emperor's life and honor.
level.constantinople.crossing.title=BYZANTINE STEWARD / On to Asia Minor
level.constantinople.crossing.body=The crossing brought the Crusaders to Asia Minor in groups. In 1097, contingents took separate routes before joining forces outside Nicaea for the siege.
conversation.open=[F] Talk
conversation.close=[F] End conversation
conversation.confirm=[F] Confirm plan
dev.title=Dev mode / Select stage
dev.help=Use arrows or W/S to choose. Enter to open. F2 returns to the selector.
overlay.levelComplete.next=ENTER - Next level
overlay.victory.restart=ENTER - New journey
hud.briefingsConfirmed=PLANS CONFIRMED / PROCEED TO THE REDOUBT
level.nicaea.chapter=STAGE 3 / THE WALLS OF NICAEA / 1097
level.nicaea.title=The Walls of Nicaea
level.nicaea.story=In 1097, the Crusaders and Byzantines besiege Nicaea. With a relief force approaching, the blockade of the lake and negotiations decide who receives the city's surrender.
level.nicaea.travel=CONFIRM THE PLANS WITH BOTH ALLIES [F]
level.nicaea.lake=LAKE ASCANIA - Nicaea receives supplies across the water.
level.nicaea.earthworks=SIEGE EARTHWORKS - The companies advance along embankments and platforms outside the walls.
level.nicaea.relief=HILLS OF NICAEA - The relief force tries to break the siege.
level.nicaea.land.title=CRUSADER OFFICER / The siege by land
level.nicaea.land.body=Each company watches a stretch of the wall. The sultan's relief force could break the siege if one sector gives way. Confirm the plan here and find Manuel Boutoumites on the lakeshore.
level.nicaea.blockade.title=MANUEL BOUTOUMITES / The blockade and the terms
level.nicaea.blockade.body=Alexios I's boats reached the lake overland. Confirm the signal so we can cut off the supply route. While you hold back the relief force, I will negotiate the garrison's surrender to the emperor.
level.nicaea.arena=The Relief Duelist strikes twice. The second cut breaks a held guard. Dodge or parry, then counter during recovery.
level.nicaea.fight=STOP THE DUELIST
level.nicaea.boss=RELIEF DUELIST
level.nicaea.exit=REACH THE BYZANTINE STANDARD
level.nicaea.complete=NICAEA UNDER BYZANTINE CONTROL
level.nicaea.victory=With the relief force repelled and the lake blockaded, the garrison accepted the terms negotiated by Manuel Boutoumites. In June 1097, Nicaea was handed over to Alexios I.
