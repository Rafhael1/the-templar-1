level.constantinople.chapter=STAGE 2 / AT THE GATES OF CONSTANTINOPLE / 1096-1097
level.constantinople.title=At the Gates of Constantinople
level.constantinople.story=The Crusader leaders negotiate with Alexios I over former Byzantine territories and passage to Asia.
level.constantinople.travel=REACH THE BOSPHORUS
level.constantinople.city=CONSTANTINOPLE - The Crusader leaders assemble.
level.constantinople.harbor=BOSPHORUS - The ships await in the harbor.
level.constantinople.fight=DEFEAT THE CAPTAIN
level.constantinople.boss=HARBOR CAPTAIN
level.constantinople.arena=The Harbor Captain blocks the customs house. Jump or dodge when the aim line appears.
level.constantinople.embark=BOARD FOR ASIA
level.constantinople.complete=ACROSS THE BOSPHORUS
level.constantinople.victory=With Alexios I's support and the companies united,\nthe fleet crosses the Bosphorus into Asia.\n\nENTER - New journey
level.constantinople.market=MARKET - Goods and travelers pass through the arcades on the way to the harbor.
level.constantinople.oath.title=ALEXIOS I / The oaths
level.constantinople.oath.body=Between 1096 and 1097, the leaders reached Constantinople at different times. Alexios I asked them to swear to return recaptured cities that had once belonged to the Empire. In return, the Crusaders counted on Byzantine support to continue their journey.
level.constantinople.rivalry.title=CRUSADER ENVOY / The disagreements
level.constantinople.rivalry.body=Each company had interests of its own. Raymond of Toulouse resisted the oath other leaders had taken. According to some chronicles, he pledged to respect the emperor's life and honor.
level.constantinople.crossing.title=BYZANTINE STEWARD / On to Asia Minor
level.constantinople.crossing.body=The crossing brought the Crusaders to Asia Minor in groups. In 1097, contingents took separate routes before joining forces outside Nicaea for the siege.
conversation.open=[F] Talk
conversation.close=[F] End conversation
dev.title=Dev mode / Select stage
dev.help=Use arrows or W/S to choose. Enter to open. F2 returns to the selector.
