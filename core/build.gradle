dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets.main.resources.srcDirs = [rootProject.file('assets')]
def versionResources = layout.buildDirectory.dir('generated/version-resources')
def generateVersion = tasks.register('generateVersion') {
    inputs.property('gameVersion', project.version.toString())
    outputs.dir(versionResources)
    doLast {
        def output = versionResources.get().file('game-version.txt').asFile
        output.parentFile.mkdirs()
        output.setText(project.version.toString() + '\n', 'UTF-8')
    }
}
sourceSets.main.resources.srcDir(generateVersion)
test {
    systemProperty 'assets.path', rootProject.file('assets').absolutePath
    systemProperty 'test.assets.path', file('src/test/resources').absolutePath
}
